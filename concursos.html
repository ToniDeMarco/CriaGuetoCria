<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#9b1a1c" />
  <link rel="preconnect" href="https://bgwjnjauvtwvcwzzmemj.supabase.co" crossorigin />
  <link rel="preload" href="assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" as="image" type="image/webp" href="assets/img/padrao-textil-420.webp" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <meta property="og:site_name" content="Cria Gueto Cria" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Concursos literários para mulheres negras — Cria Gueto Cria" />

  <meta name="twitter:card" content="summary_large_image" />
  <!-- O build (npm run build) acrescenta aqui: canonical, og:url, og:image e dados estruturados (JSON-LD). -->
</head>
<body>
  <script src="js/preloader.js"></script>
  <div class="page-wrap">
    <div id="site-chrome"></div>
    <header class="page-hero">
      <p class="kicker" style="max-width:1180px;margin:0 auto 8px">Editais</p>
      <h1>Concursos literários</h1>
      <p>Regulamentos oficiais da casa. Leia com calma, inscreva no prazo, dispute o catálogo.</p>
    </header>
    <section class="section">
      <div class="contest-grid" id="list"></div>
    </section>
    <!-- /critico -->
  </div>
  <script src="js/config.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/analytics.js"></script>
  <script>
    CGC.ready().then(() => {
      CGCUI.mountChrome("concursos");
      const list = CGC.contests().slice().sort((a, b) => (b.publishedAt || "").localeCompare(a.publishedAt || ""));
      document.getElementById("list").innerHTML = list.map((c) => CGCUI.contestCard(c, true)).join("") || "<p>Nenhum edital publicado ainda.</p>";
    });
  </script>
</body>
