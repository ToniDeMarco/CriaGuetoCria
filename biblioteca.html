<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="only light" />
  <title>Biblioteca digital de autoras negras — Cria Gueto Cria</title>
  <meta name="description" content="Acervo digital da Cria Gueto Cria com títulos de mulheres negras: poesia, romance, ensaio, contos, memória, infantojuvenil e teatro. Busque por título, autora ou ISBN." />
  <meta name="theme-color" content="#9b1a1c" />
  <link rel="preconnect" href="https://bgwjnjauvtwvcwzzmemj.supabase.co" crossorigin />
  <link rel="preload" href="assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preconnect" href="https://lh3.googleusercontent.com" />
  <link rel="preload" as="image" type="image/webp" href="assets/img/padrao-textil-420.webp" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <meta property="og:site_name" content="Cria Gueto Cria" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Biblioteca digital de autoras negras — Cria Gueto Cria" />
  <meta property="og:description" content="Acervo digital da Cria Gueto Cria com títulos de mulheres negras: poesia, romance, ensaio, contos, memória, infantojuvenil e teatro. Busque por título, autora ou ISBN." />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- O build (npm run build) acrescenta aqui: canonical, og:url, og:image e dados estruturados (JSON-LD). -->
</head>
<body>
  <script src="js/preloader.js"></script>
  <div class="page-wrap">
    <div id="site-chrome"></div>
    <header class="page-hero">
      <p class="kicker" style="max-width:1180px;margin:0 auto 8px">Acervo</p>
      <h1>Biblioteca digital</h1>
      <p>O Drive da editora, agora em casa. <span data-book-count>50</span> títulos de mulheres negras — para ler, indicar, disputar espaço na estante.</p>
    </header>
    <section class="section">
      <div class="filters">
        <input class="search" id="q" type="search" placeholder="Buscar por título, autora, ISBN…" aria-label="Buscar no acervo" />
        <button class="chip is-on" data-f="all">Todos</button>
        <button class="chip" data-f="Poesia">Poesia</button>
        <button class="chip" data-f="Romance">Romance</button>
        <button class="chip" data-f="Ensaio">Ensaio</button>
        <button class="chip" data-f="Contos">Contos</button>
        <button class="chip" data-f="Memória">Memória</button>
        <button class="chip" data-f="Infantojuvenil">Infantojuvenil</button>
        <button class="chip" data-f="Antologia">Antologia</button>
        <button class="chip" data-f="Teatro">Teatro</button>
      </div>
      <h2 class="sr-only">Títulos do acervo</h2>
      <p class="count" id="count" style="max-width:1180px;margin:0 auto 18px"></p>
      <div class="grid-books" id="shelf"></div>
    </section>
    <!-- /critico -->
  </div>
  <script src="js/config.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/analytics.js"></script>
  <script>
    CGC.ready().then(() => {
      CGCUI.mountChrome("biblioteca");
      let genre = "all";
      const shelf = document.getElementById("shelf");
      const q = document.getElementById("q");
      function render() {
        const term = q.value.trim().toLowerCase();
        const list = CGC.books().filter((b) => {
          const g = genre === "all" || b.genre === genre;
          const t = !term || [b.title, b.author, b.isbn, b.territory, b.synopsis].join(" ").toLowerCase().includes(term);
          return g && t;
        });
        document.getElementById("count").textContent = list.length + " título" + (list.length === 1 ? "" : "s") + " no recorte";
        shelf.innerHTML = list.map((b, i) => CGCUI.bookCard(b, i)).join("");
      }
      document.querySelector(".filters").addEventListener("click", (e) => {
        const chip = e.target.closest(".chip");
        if (!chip) return;
        document.querySelectorAll(".chip").forEach((c) => c.classList.remove("is-on"));
        chip.classList.add("is-on");
        genre = chip.dataset.f;
        render();
      });
      q.addEventListener("input", render);
      shelf.addEventListener("click", (e) => {
        const card = e.target.closest(".book-card");
        if (card) CGCUI.openBookModal(card.dataset.id);
      });
      // ?q=termo já chega buscando; ?livro=ID abre a ficha (links de anúncio e de compartilhamento)
      const params = new URLSearchParams(location.search);
      q.value = params.get("q") || "";
      render();
      if (params.get("livro")) CGCUI.openBookModal(params.get("livro"));
    });
  </script>
</body>
</html>
