<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="only light" />
  <title>Regulamento de concurso literário — Cria Gueto Cria</title>
  <meta name="description" content="Regulamento completo de concurso literário da Cria Gueto Cria: prazos, categorias e regras de inscrição." />
  <meta name="theme-color" content="#9b1a1c" />
  <link rel="preconnect" href="https://bgwjnjauvtwvcwzzmemj.supabase.co" crossorigin />
  <link rel="preload" href="assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" as="image" type="image/webp" href="assets/img/padrao-textil-420.webp" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <meta property="og:site_name" content="Cria Gueto Cria" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Regulamento de concurso literário — Cria Gueto Cria" />
  <meta property="og:description" content="Regulamento completo de concurso literário da Cria Gueto Cria: prazos, categorias e regras de inscrição." />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- O build (npm run build) acrescenta aqui: canonical, og:url, og:image e dados estruturados (JSON-LD). -->
</head>
<body>
  <script src="js/preloader.js"></script>
  <div class="page-wrap">
    <div id="site-chrome"></div>
    <header class="page-hero">
      <p class="kicker" id="kicker" style="max-width:1180px;margin:0 auto 8px"></p>
      <h1 id="title"></h1>
      <p id="excerpt"></p>
    </header>
    <section class="section">
      <article class="regulation" id="body"></article>
      <p style="max-width:760px;margin:28px auto 0;display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn btn-ghost dark" href="concursos.html">Todos os concursos</a>
        <a class="btn btn-solid" id="wa" target="_blank" rel="noopener">Dúvidas no WhatsApp</a>
      </p>
    </section>
    <!-- /critico -->
  </div>
  <script src="js/config.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/analytics.js"></script>
  <script>
    CGC.ready().then(() => {
      CGCUI.mountChrome("concursos");
      const id = new URLSearchParams(location.search).get("id");
      const c = CGC.contest(id);
      const s = CGC.settings();
      if (!c) {
        document.getElementById("title").textContent = "Edital não encontrado";
        document.head.insertAdjacentHTML("beforeend", '<meta name="robots" content="noindex" />');
        document.getElementById("body").innerHTML = "<p>Este regulamento foi removido ou o link está incompleto.</p>";
      } else {
        document.title = c.title + " — Cria Gueto Cria";
        document.querySelector('meta[name="description"]').setAttribute("content", c.excerpt);
        document.getElementById("kicker").textContent = CGCUI.statusLabel(CGC.statusOf(c)) + " · " + c.category;
        document.getElementById("title").textContent = c.title;
        document.getElementById("excerpt").textContent = c.excerpt;
        document.getElementById("body").innerHTML = c.regulation;
        document.getElementById("wa").href = CGCUI.waLink(s.whatsapp, "Dúvida sobre o concurso: " + c.title);
      }
    });
  </script>
</body>
</html>
