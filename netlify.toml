# Netlify: roda o build (scripts/build.mjs) e publica a pasta dist/.
# Domínio próprio: defina SITE_URL em Site configuration > Environment variables
# (ex.: https://criaguetocria.com.br). Sem isso, usa o endereço .netlify.app.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Fontes não mudam: cache de um ano. Fotos: uma semana (o nome do arquivo se repete quando a foto é trocada).
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
